# Local equivalent of the zabiny.club nginx vhost (prod: /root/nginx-gen/gen.py → snippets/grav.conf).
# Differences: plain HTTP, no limit_req / fail2ban, PHP over TCP instead of a unix socket.

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 34m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    ## Grav security rules (getgrav webserver-configs/nginx.conf)
    location ~* /(\.git|cache|bin|logs|backup|tests)/.*$ { return 403; }
    location ~* /(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    location ~* /user/.*\.(txt|md|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    location ~ /(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess) { return 403; }

    ## extra prod rules: secrets and repo internals under user/
    location ~* ^/user/(accounts|config|data|docker|zabiny\.club|\.git)(/|$) { return 403; }
    location ~ /\. { return 403; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }
}
