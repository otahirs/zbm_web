# Local test environment close to zabiny.club production:
#   nginx  ->  php-fpm 8.3 (Grav 1.7, this repo mounted as user/)
#   scheduler = prod cron `bin/grav scheduler`, mailpit catches all outgoing mail.
# Usage: see README.md, section Development.

name: zbm-web

services:
  php:
    image: zbm-web/php:local
    build:
      context: docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - grav:/var/www/html
      - ./:/var/www/html/user
    environment:
      MP_SENDMAIL_SMTP_ADDR: mailpit:1025
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on: [php]
    ports:
      - "${ZBM_HTTP_PORT:-8000}:80"
    volumes:
      - grav:/var/www/html:ro
      - ./:/var/www/html/user:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  scheduler:
    image: zbm-web/php:local
    build:
      context: docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    depends_on: [php]
    volumes:
      - grav:/var/www/html
      - ./:/var/www/html/user
    environment:
      MP_SENDMAIL_SMTP_ADDR: mailpit:1025
      ZBM_CREATE_TEST_USER: "0"
      ZBM_SYNC_CORE: "0"      # the php service owns the shared Grav core volume
    command: ["sh", "-c", "while :; do su -s /bin/sh www-data -c 'php bin/grav scheduler' >/dev/null 2>&1; sleep 60; done"]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${ZBM_MAIL_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  grav:
